name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

  workflow_dispatch:
    inputs:
      environment:
        description: Entorno destino
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      image_tag:
        description: Tag de GHCR (short SHA, 7+ hex). Vacío = SHA actual.
        type: string
        required: false

permissions: {}

jobs:
  resolve:
    name: Resolve and verify image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      packages: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      tag: ${{ steps.resolve.outputs.tag }}
      deploy_dev: ${{ steps.resolve.outputs.deploy_dev }}
      deploy_prod: ${{ steps.resolve.outputs.deploy_prod }}
    steps:
      - name: Resolve tag and targets
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [ "$EVENT" = "workflow_run" ]; then
            TAG="${CI_SHA::7}"
            DEPLOY_DEV=true
            DEPLOY_PROD=true
          else
            TAG="${INPUT_TAG:-${GITHUB_SHA::7}}"
            DEPLOY_DEV=$([ "$INPUT_ENV" = "dev" ] && echo true || echo false)
            DEPLOY_PROD=$([ "$INPUT_ENV" = "prod" ] && echo true || echo false)

            if [ "$DEPLOY_PROD" = "true" ] && [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "::error::prod solo puede desplegarse desde master."
              exit 1
            fi
          fi

          if ! [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Tag inválido '$TAG'. Debe ser un SHA hexadecimal."
            exit 1
          fi

          {
            echo "image=$IMAGE"
            echo "tag=$TAG"
            echo "deploy_dev=$DEPLOY_DEV"
            echo "deploy_prod=$DEPLOY_PROD"
          } >> "$GITHUB_OUTPUT"

      - name: Verify image exists in GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REF: ${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.tag }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools inspect "$REF" > /dev/null

  deploy-dev:
    name: Deploy Dev
    needs: resolve
    if: needs.resolve.outputs.deploy_dev == 'true'
    permissions:
      contents: write # el reusable commitea el tag en el overlay
    concurrency:
      group: cd-dev
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      image: ${{ needs.resolve.outputs.image }}
      image_tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  deploy-prod:
    name: Deploy Prod
    needs: [resolve, deploy-dev]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.deploy_prod == 'true' &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
    permissions:
      contents: write # el reusable commitea el tag en el overlay
    concurrency:
      group: cd-prod
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      image: ${{ needs.resolve.outputs.image }}
      image_tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit
