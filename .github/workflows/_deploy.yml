name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment y overlay de kustomize (dev | prod)
        type: string
        required: true
      image:
        description: Repositorio de la imagen en GHCR (sin tag)
        type: string
        required: true
      image_tag:
        description: Tag inmutable a desplegar (short SHA)
        type: string
        required: true

permissions:
  contents: read

env:
  APP_NAME: app-python
  KUBECTL_VERSION: v1.31.4
  KUSTOMIZE_VERSION: v5.5.0
  ROLLOUT_TIMEOUT: 300s

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}

    env:
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ inputs.image }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      OVERLAY_DIR: app-python-gitops/overlays/${{ inputs.environment }}
      NAMESPACE: app-python-${{ inputs.environment }}
      RENDERED: ${{ github.workspace }}/rendered-${{ inputs.environment }}.yaml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Setup kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kustomize" version

      - name: Update image tag in overlay
        working-directory: ${{ env.OVERLAY_DIR }}
        run: |
          kustomize edit set image "${IMAGE}:${IMAGE_TAG}"
          cat kustomization.yaml

      - name: Commit and push GitOps state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "${OVERLAY_DIR}/kustomization.yaml"; then
            echo "Sin cambios en ${OVERLAY_DIR}/kustomization.yaml"
            exit 0
          fi

          git add "${OVERLAY_DIR}/kustomization.yaml"
          git commit -m "chore(${ENVIRONMENT}): set image tag ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Render manifests
        run: |
          kustomize build "$OVERLAY_DIR" > "$RENDERED"
          grep -qF "${IMAGE}:${IMAGE_TAG}" "$RENDERED"

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ inputs.environment }}-${{ inputs.image_tag }}
          path: ${{ env.RENDERED }}
          retention-days: 30

      - name: Configure cluster access
        id: kube
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::warning::KUBE_CONFIG no definido en '${ENVIRONMENT}'; se omite aplicación en clúster."
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KUBECONFIG_FILE="$RUNNER_TEMP/kubeconfig"
          echo "$KUBE_CONFIG" | base64 -d > "$KUBECONFIG_FILE"
          chmod 600 "$KUBECONFIG_FILE"
          echo "KUBECONFIG=$KUBECONFIG_FILE" >> "$GITHUB_ENV"
          echo "apply=true" >> "$GITHUB_OUTPUT"

      - name: Apply manifests and verify rollout
        if: steps.kube.outputs.apply == 'true'
        run: |
          kubectl apply -f "$RENDERED"
          kubectl rollout status "deployment/${APP_NAME}" -n "$NAMESPACE" --timeout="$ROLLOUT_TIMEOUT"
