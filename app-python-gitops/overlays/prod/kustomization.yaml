apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-python-prod

resources:
- namespace.yaml
- ../../base
- externalsecret.yaml
- networkpolicy.yaml
- ingress.yaml

labels:
- pairs:
    app.kubernetes.io/environment: prod

configMapGenerator:
- behavior: merge
  literals:
  - DJANGO_ALLOWED_HOSTS=app-python.example.com
  name: app-python-config

images:
- name: ghcr.io/drcoffee84/devsu-danielboullon-devops
  newTag: d8df406

patches:
- path: patches/deployment.yaml
- path: patches/hpa.yaml
- path: patches/pdb.yaml
- patch: |-
    - op: remove
      path: /spec/replicas
  target:
    kind: Deployment
    name: app-python
