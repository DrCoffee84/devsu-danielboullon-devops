apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-python-prod

resources:
  - namespace.yaml
  - ../../base
  - externalsecret.yaml
  - networkpolicy.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: prod

# Versión desplegada en prod. Mismo repositorio GHCR que dev, tag propio.
# El CD la reemplaza en el runner con `kustomize edit set image` antes de
# aplicar (no se commitea). El valor de acá es solo el último conocido, para
# poder renderizar el overlay localmente. Nunca `latest`: siempre short SHA.
images:
  - name: ghcr.io/drcoffee84/devsu-danielboullon-devops
    newTag: 88dc298

patches:
  - path: patches/deployment.yaml
  - path: patches/hpa.yaml
  - path: patches/pdb.yaml
  # El HPA es dueño de las réplicas: si el Deployment declara `replicas`,
  # cada deploy pisaría el valor escalado por el HPA.
  # Ojo: sacar `replicas` de un Deployment que ya lo tenía aplicado lo baja a 1
  # en el próximo apply; acá es seguro porque el namespace nace con este overlay.
  - target:
      kind: Deployment
      name: app-python
    patch: |-
      - op: remove
        path: /spec/replicas
