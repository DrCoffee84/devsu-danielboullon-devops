# El secreto no vive en git: External Secrets Operator lo lee de Vault y crea
# el Secret `app-python-secret` que consume el Deployment (envFrom.secretRef).
# Requiere ESO instalado y un ClusterSecretStore `vault-backend` en el cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-python-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: app-python-secret
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: app-python/prod
        property: DJANGO_SECRET_KEY
