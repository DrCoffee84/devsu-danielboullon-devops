apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-python
spec:
  revisionHistoryLimit: 10 # más historia para `kubectl rollout undo`
  template:
    spec:
      terminationGracePeriodSeconds: 30
      # Se suma al spread por nodo de la base: también repartir entre zonas.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
      containers:
        - name: api
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
