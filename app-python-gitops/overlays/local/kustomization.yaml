apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-python-local

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: local

images:
  - name: ghcr.io/drcoffee84/devsu-danielboullon-devops
    newTag: latest

# Para simplificar el laboratorio se usa secretGenerator con un valor de prueba.
# En producción los secretos vivirían en HashiCorp Vault y External Secrets
# Operator los sincronizaría como Secret de Kubernetes.
secretGenerator:
  - name: app-python-secret
    literals:
      - DJANGO_SECRET_KEY=local-lab-not-a-real-secret
