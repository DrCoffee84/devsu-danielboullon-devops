apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-python
spec:
  ingressClassName: nginx
  rules:
    - host: app-python.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-python
                port:
                  name: http
