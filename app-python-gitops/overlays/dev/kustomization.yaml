apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-python-dev

resources:
  - namespace.yaml
  - ../../base
  - externalsecret.yaml
  - networkpolicy.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: dev

configMapGenerator:
  - name: app-python-config
    behavior: merge
    literals:
      - DJANGO_ALLOWED_HOSTS=app-python.dev.example.com

images:
  - name: ghcr.io/drcoffee84/devsu-danielboullon-devops
    newTag: 88dc298

patches:
  - path: patches/hpa.yaml
  - path: patches/pdb.yaml
  - target:
      kind: Deployment
      name: app-python
    patch: |-
      - op: remove
        path: /spec/replicas