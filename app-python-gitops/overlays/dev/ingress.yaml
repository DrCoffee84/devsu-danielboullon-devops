apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-python
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app-python.dev.example.com # reemplazar por el dominio real
      secretName: app-python-tls
  rules:
    - host: app-python.dev.example.com # reemplazar por el dominio real
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-python
                port:
                  name: http
