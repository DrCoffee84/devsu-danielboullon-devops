# Mismo mecanismo que prod (paridad de entornos), otra ruta en Vault.
# Requiere ESO instalado y un ClusterSecretStore `vault-backend` en el cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-python-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: app-python-secret
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: app-python/dev
        property: DJANGO_SECRET_KEY
    # postgres://<user>:<pass>@<host>:5432/<db> de la base gestionada (ej: RDS)
    - secretKey: DATABASE_URL
      remoteRef:
        key: app-python/dev
        property: DATABASE_URL
