apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-python
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-python
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
