apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: app-python
      app.kubernetes.io/part-of: devsu-demo
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

configMapGenerator:
  - name: app-python-config
    literals:
      # Ruta absoluta dentro del emptyDir /data (el rootfs es de solo lectura).
      - DATABASE_NAME=/data/db.sqlite3
