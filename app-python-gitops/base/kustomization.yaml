apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: app-python
      app.kubernetes.io/part-of: devsu-demo
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

# Config no sensible. Cada overlay suma DJANGO_ALLOWED_HOSTS con su dominio.
# DATABASE_URL tiene credenciales, por eso va en el Secret de cada overlay.
configMapGenerator:
  - name: app-python-config
    literals:
      - DJANGO_DEBUG=False
